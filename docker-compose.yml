services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iReports}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iReports}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      # Контекст — корень репозитория: backend зависит от workspace-пакета
      # ireports-contracts (../contracts), который резолвится через корневой npm workspace
      context: .
      dockerfile: backend/docker/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iReports}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      # Захардкожено (не читается из .env) — блокирует dev-only байпас
      # авторизации (AUTH_DISABLED, см. backend/src/shared/config/dev-auth-bypass.ts)
      # на любом docker-compose-развёртывании этого файла (и прод, и dev-стенд),
      # даже если AUTH_DISABLED случайно попадёт в серверный .env.
      NODE_ENV: production
      # dev-стенд (ветка `dev`, деплой через .github/workflows/deploy-dev.yml) — отдельный домен от
      # прода (ireports.murygin.tech/api.murygin.tech, см. ветку main), не мержить это значение назад.
      CORS_ORIGIN: https://ireports.murygin.tech
      # Родительский домен для session_id/csrf_token cookies — без него cookie scope'ится только на
      # test.api.murygin.tech, и фронтенд (test.ireports.murygin.tech) не может прочитать csrf_token
      # через document.cookie (CsrfGuard отклонял все мутирующие запросы). Оба поддомена (frontend/
      # backend) dev-стенда — под .murygin.tech, как и прод; не мержить это значение назад в main.
      COOKIE_DOMAIN: .murygin.tech
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL}
      SECRET_ACCESS: ${SECRET_ACCESS}
      SECRET_REFRESH: ${SECRET_REFRESH}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOKI_HOST: ${LOKI_HOST:-http://loki:3100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
    ports:
      - "3000:3000"

  frontend:
    build:
      # Контекст — корень репозитория (как и у backend выше): frontend зависит от workspace-пакета
      # ireports-contracts (../contracts) как значений, не только типов (ruleFormSchema.ts,
      # salaryRuleRequestSchema), и его нужно собрать (dist/) до `vite build` — при context:
      # ./frontend каталог contracts/ физически недоступен внутри сборки, и Rolldown не может
      # разрешить импорт (проявляется, только когда есть хотя бы один такой value-импорт).
      context: .
      dockerfile: frontend/docker/Dockerfile
      args:
        VITE_API_URL: https://api.murygin.tech
        # Переиспользуем BITRIX24_CLIENT_ID из корневого .env — client_id не секрет и совпадает
        # с backend'ным, отдельную переменную в .env заводить не нужно.
        VITE_BITRIX24_CLIENT_ID: ${BITRIX24_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Порт наружу не публикуется — доступ только из внутренней docker-сети (backend, grafana),
    # как и в проде (см. ветку main).

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "3003:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  loki_data:
  prometheus_data:
  grafana_data:
