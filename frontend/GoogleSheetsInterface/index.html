<!DOCTYPE html>
<html>
<head>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 16px;
            font-family: sans-serif;
            background: #fff;
            overflow-x: hidden;
        }

        /* ── GLASS LOADER ─────────────────────────────────────────── */
        .glass-loader {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: start;
            justify-content: center;
            padding-top: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
            z-index: 999;
        }

        .glass-loader.active {
            opacity: 1;
            pointer-events: all;
        }

        .loader-card {
            width: 260px;
            border-radius: 22px;
            padding: 20px 16px 16px;
            background: rgba(255,255,255,0.92);
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popup .25s ease;
        }

        @keyframes popup {
            from { transform: scale(.95) translateY(8px); opacity: 0; }
            to   { transform: scale(1)   translateY(0);   opacity: 1; }
        }

        .loader-ring {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            position: relative;
            margin-bottom: 14px;
            background: conic-gradient(from 0deg, #4CAF50, #7be27f, #4CAF50);
            animation: spin 1.1s linear infinite;
            flex-shrink: 0;
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            inset: 5px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-title {
            font-size: 14px;
            font-weight: 700;
            color: #222;
            margin-bottom: 4px;
            text-align: center;
        }

        .loader-subtitle {
            font-size: 12px;
            color: #555;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 12px;
            min-height: 16px;
        }

        /* ── LOG LIST ─────────────────────────────────────────────── */
        .loader-divider {
            width: 100%;
            height: 1px;
            background: rgba(0,0,0,0.07);
            margin-bottom: 10px;
        }

        .loader-log {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 110px;
            overflow-y: auto;
        }

        .log-line {
            font-size: 11px;
            color: #888;
            line-height: 1.35;
            display: flex;
            align-items: flex-start;
            gap: 5px;
            animation: fadeIn .2s ease;
        }

        .log-line.latest {
            color: #333;
            font-weight: 600;
        }

        .log-icon {
            flex-shrink: 0;
            margin-top: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* ── ВКЛАДКИ ──────────────────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1.5px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 9px 4px;
            background: none;
            border: none;
            border-bottom: 2.5px solid transparent;
            font-size: 13px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: color .15s ease, border-color .15s ease;
        }

        .tab-btn.active {
            color: #2e7d32;
            border-bottom-color: #4CAF50;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── ОСТАЛЬНОЕ ────────────────────────────────────────────── */
        button:disabled { cursor: not-allowed; }
    </style>
</head>
<body>

<!-- GLASS LOADER -->
<div id="glassLoader" class="glass-loader">
    <div class="loader-card">
        <div class="loader-ring"></div>

        <div class="loader-title">Синхронизация<span class="dots"></span></div>
        <div class="loader-subtitle" id="loaderText">Подготовка...</div>

        <div class="loader-divider"></div>
        <div class="loader-log" id="loaderLog"></div>
    </div>
</div>

<!-- ВКЛАДКИ -->
<div class="tabs">
    <button class="tab-btn active" id="tabBtnMs" onclick="switchTab('ms')">Мой склад</button>
    <button class="tab-btn" id="tabBtnRo" onclick="switchTab('ro')">Ремонлайн</button>
</div>

<!-- ВКЛАДКА: МОЙ СКЛАД -->
<div class="tab-panel active" id="tabMs">
    <h4>Загрузите прайс Trade-mi</h4>

    <div id="dropZone"
         onclick="document.getElementById('fileInput').click()"
         style="border:1.5px dashed #ccc;border-radius:10px;padding:20px 12px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:12px;background:#fafafa;">
        <svg width="28" height="28" fill="none" stroke="#4CAF50" stroke-width="2" viewBox="0 0 24 24" style="margin-bottom:8px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p id="dropText" style="margin:0;font-size:13px;color:#555;line-height:1.4;">Нажмите или перетащите файл</p>
    </div>

    <p style="margin:4px 0 14px;font-size:13px;color:#888;line-height:1.5;">В таблице обязательно должны быть страницы "Apple(iPhone, Watch)" и "Apple (iPad, Macbook)". Формат: .xlsx, .xls. </p>

    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">

    <button onclick="uploadFile()" id="uploadBtn"
            style="width:100%;padding:11px;background:#4CAF50;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;">
        Загрузить прайс
    </button>

    <h4>Синхронизация с Мой Склад</h4>

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:4px;">
        <button onclick="uploadPrices()" id="uploadRcBtn"
                style="padding:10px;background:#fff;color:#4CAF50;border:1.5px solid #4CAF50;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">
            ⬆ Обновить РЦ в МС
        </button>
        <button onclick="uploadSalePrices()" id="uploadSaleBtn"
                style="padding:10px;background:#fff;color:#4CAF50;border:1.5px solid #4CAF50;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">
            ⬆ Обновить акционную РЦ в МС
        </button>
        <button onclick="loadPrices()" id="loadBtn"
                style="padding:10px;background:#fff;color:#2955af;border:1.5px solid #2955af;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">
            ⬇ Получить цены из МС
        </button>
    </div>
</div>

<!-- ВКЛАДКА: РЕМОНЛАЙН -->
<div class="tab-panel" id="tabRo">
    <h4>Синхронизация с Ремонлайн</h4>

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:4px;">
        <button onclick="uploadPricesToRO()" id="uploadRoBtn"
                style="padding:10px;background:#fff;color:#4CAF50;border:1.5px solid #4CAF50;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">
            ⬆ Загрузить цены в RO
        </button>
        <button onclick="uploadMasterAccruals()" id="uploadAccrualsBtn"
                style="padding:10px;background:#fff;color:#2955af;border:1.5px solid #2955af;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">
            ⬇ Обновить начисления мастеров в Таблице
        </button>
        <button disabled id="createServiceBtn"
                style="padding:10px;background:#fff;color:#888;border:1.5px solid #ccc;border-radius:8px;font-size:13px;font-weight:600;cursor:not-allowed;">
            ➕ Создать новую услугу
        </button>
    </div>

    <div id="roSummary" style="display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#f7f9f7;border:1px solid #e0e0e0;font-size:12px;color:#333;line-height:1.7;"></div>
</div>

<div id="status" style="margin-top:12px;font-size:13px;text-align:center;min-height:18px;"></div>

<script>
    const BASE_URL = 'https://api.murygin.tech';

    const fileInput = document.getElementById('fileInput');
    const dropZone  = document.getElementById('dropZone');

    fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) {
            document.getElementById('dropText').textContent = fileInput.files[0].name;
            dropZone.style.borderColor = '#4CAF50';
            dropZone.style.background  = '#f0f9f5';
        }
    });

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.style.borderColor = '#4CAF50';
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#ccc';
        dropZone.style.background  = '#fafafa';
    });

    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        if (e.dataTransfer.files[0]) {
            fileInput.files = e.dataTransfer.files;
            document.getElementById('dropText').textContent = e.dataTransfer.files[0].name;
            dropZone.style.borderColor = '#4CAF50';
            dropZone.style.background  = '#f0f9f5';
        }
    });

    // ── ВКЛАДКИ ─────────────────────────────────────────────────

    function switchTab(name) {
        document.getElementById('tabMs').classList.toggle('active', name === 'ms');
        document.getElementById('tabRo').classList.toggle('active', name === 'ro');
        document.getElementById('tabBtnMs').classList.toggle('active', name === 'ms');
        document.getElementById('tabBtnRo').classList.toggle('active', name === 'ro');
        setStatus('', '');
    }

    // ── LOADER ──────────────────────────────────────────────────

    function showLoader(text) {
        document.getElementById('loaderLog').innerHTML = '';
        document.getElementById('loaderText').textContent = text || 'Подготовка...';
        document.getElementById('glassLoader').classList.add('active');
    }

    function hideLoader() {
        document.getElementById('glassLoader').classList.remove('active');
    }

    function updateLoader(message) {
        document.getElementById('loaderText').textContent = message;
    }

    function addLogLine(message) {
        const log = document.getElementById('loaderLog');

        // Снять класс latest с предыдущей строки
        const prev = log.querySelector('.log-line.latest');
        if (prev) prev.classList.remove('latest');

        const line = document.createElement('div');
        line.className = 'log-line latest';
        line.innerHTML = `<span class="log-icon">›</span><span>${message}</span>`;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }

    // ── SSE ПОТОК ───────────────────────────────────────────────

    function startProgressStream(uuid) {
        const es = new EventSource(BASE_URL + '/price-monitoring/' + uuid);
        let finished = false;

        es.onmessage = (e) => {
            const { message, status, type } = JSON.parse(e.data);

            if (type) return

            updateLoader(message);
            addLogLine(message);

            if (status === 'done') {
                finished = true;
                es.close();
                hideLoader();
                setStatus('✅ Готово!', '#2e7d32');
                resetBtn('uploadBtn', 'Загрузить прайс');
            }

            if (status === 'error') {
                finished = true;
                es.close();
                hideLoader();
                setStatus('❌ ' + message, '#c62828');
                resetBtn('uploadBtn', 'Загрузить прайс');
            }
        };

        es.onerror = () => {
            es.close();
            if (finished) return;
            hideLoader();
            setStatus('❌ Соединение прервано', '#c62828');
            resetBtn('uploadBtn', 'Загрузить прайс');
        };
    }

    // ── КНОПКИ ──────────────────────────────────────────────────

    function uploadFile() {
        const file = fileInput.files[0];
        if (!file) { setStatus('⚠️ Выберите файл', '#e65100'); return; }

        showLoader('Загрузка файла на сервер...');
        setBtnLoading('uploadBtn', 'Загрузка...');
        setStatus('', '');

        const reader = new FileReader();
        reader.onload = (e) => {
            const base64 = e.target.result.split(',')[1];

            google.script.run
                .withSuccessHandler((uuid) => {
                    updateLoader('Подключение к потоку...');
                    startProgressStream(uuid);
                })
                .withFailureHandler(err => {
                    hideLoader();
                    setStatus('❌ ' + err.message, '#c62828');
                    resetBtn('uploadBtn', 'Загрузить прайс');
                })
                .processFile(base64);
        };
        reader.readAsDataURL(file);
    }

    function loadPrices() {
        showLoader('Получаем цены из МойСклад');
        setBtnLoading('loadBtn', 'Загрузка...');
        setStatus('', '');

        google.script.run
            .withSuccessHandler(() => {
                hideLoader();
                setStatus('✅ РЦ загружена из МойСклад!', '#2e7d32');
                resetBtn('loadBtn', '⬇ Получить цены из МС');
            })
            .withFailureHandler(err => {
                hideLoader();
                setStatus('❌ ' + err.message, '#c62828');
                resetBtn('loadBtn', '⬇ Получить цены из МС');
            })
            .loadPricesFromMS();
    }

    function uploadPrices() {
        showLoader('Выгружаем РЦ в МойСклад');
        setBtnLoading('uploadRcBtn', 'Выгрузка...');
        setStatus('', '');

        google.script.run
            .withSuccessHandler(() => {
                hideLoader();
                setStatus('✅ РЦ выгружена в МойСклад!', '#2e7d32');
                resetBtn('uploadRcBtn', '⬆ Обновить РЦ в МС');
            })
            .withFailureHandler(err => {
                hideLoader();
                setStatus('❌ ' + err.message, '#c62828');
                resetBtn('uploadRcBtn', '⬆ Обновить РЦ в МС');
            })
            .uploadPricesToMS();
    }

    function uploadSalePrices() {
        showLoader('Выгружаем акционную цену в МойСклад');
        setBtnLoading('uploadSaleBtn', 'Выгрузка...');
        setStatus('', '');

        google.script.run
            .withSuccessHandler(() => {
                hideLoader();
                setStatus('✅ Акционная РЦ выгружена в МойСклад!', '#2e7d32');
                resetBtn('uploadSaleBtn', '⬆ Обновить акционную РЦ в МС');
            })
            .withFailureHandler(err => {
                hideLoader();
                setStatus('❌ ' + err.message, '#c62828');
                resetBtn('uploadSaleBtn', '⬆ Обновить акционную РЦ в МС');
            })
            .uploadSalePricesToMS();
    }

    function renderRoSummary(count) {
        const el = document.getElementById('roSummary');
        el.innerHTML =
            `Всего: <b>${count.total}</b><br>` +
            `Валидных: <b>${count.valid}</b><br>` +
            `Создано: <b>${count.create}</b><br>` +
            `Обновлено: <b>${count.update}</b><br>` +
            `Ошибок: <b>${count.errors}</b>`;
        el.style.borderColor = count.errors > 0 ? '#e65100' : '#e0e0e0';
        el.style.display = 'block';
    }

    function uploadPricesToRO() {
        showLoader('Выгружаем цены в Ремонлайн');
        setBtnLoading('uploadRoBtn', 'Выгрузка...');
        setStatus('', '');
        document.getElementById('roSummary').style.display = 'none';

        google.script.run
            .withSuccessHandler((result) => {
                hideLoader();
                renderRoSummary(result.count);
                setStatus(
                    result.success ? '✅ Цены выгружены в Ремонлайн!' : '❌ Выгрузка завершилась с ошибкой',
                    result.success ? '#2e7d32' : '#c62828'
                );
                resetBtn('uploadRoBtn', '⬆ Загрузить цены в RO');
            })
            .withFailureHandler(err => {
                hideLoader();
                setStatus('❌ ' + err.message, '#c62828');
                resetBtn('uploadRoBtn', '⬆ Загрузить цены в Ремонлайн');
            })
            .uploadPricesToRO();
    }

    function runServerFunction(name) {
        const args = Array.prototype.slice.call(arguments, 1);
        return new Promise((resolve, reject) => {
            const call = google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject);
            call[name].apply(call, args);
        });
    }

    async function uploadMasterAccruals() {
        showLoader('Обновляем начисления мастеров');
        setBtnLoading('uploadAccrualsBtn', 'Обновление...');
        setStatus('', '');

        try {
            updateLoader('Читаем данные из таблицы...');
            addLogLine('Читаем данные из таблицы...');
            const entries = await runServerFunction('getAccrualsSheetEntries');

            updateLoader('Запрашиваем начисления из RemOnline...');
            addLogLine('Запрашиваем начисления из RemOnline...');
            const earningsById = await runServerFunction('fetchServiceBonusesMap');

            updateLoader('Сравниваем и обновляем таблицу...');
            addLogLine('Сравниваем и обновляем таблицу...');
            const updatedIds = await runServerFunction('applyAccrualsUpdates', entries, earningsById);

            hideLoader();
            if (updatedIds.length) {
                setStatus('✅ Обновлено начислений: ' + updatedIds.length + ' (ID: ' + updatedIds.join(', ') + ')', '#2e7d32');
            } else {
                setStatus('✅ Готово, изменений не найдено', '#2e7d32');
            }
            resetBtn('uploadAccrualsBtn', '⬆ Обновить начисления мастеров');
        } catch (err) {
            hideLoader();
            setStatus('❌ ' + (err && err.message ? err.message : err), '#c62828');
            resetBtn('uploadAccrualsBtn', '⬆ Обновить начисления мастеров');
        }
    }

    // ── УТИЛИТЫ ─────────────────────────────────────────────────

    function setBtnLoading(id, text) {
        const btn = document.getElementById(id);
        btn.textContent = text;
        btn.style.opacity = '0.6';
        btn.disabled = true;
    }

    function resetBtn(id, text) {
        const btn = document.getElementById(id);
        btn.textContent = text;
        btn.style.opacity = '1';
        btn.disabled = false;
    }

    function setStatus(msg, color) {
        const s = document.getElementById('status');
        s.textContent = msg;
        s.style.color = color;
    }
</script>

</body>
</html>
