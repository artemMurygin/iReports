name: Deploy (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to dev stand
        id: deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ../iRepair/iReports-dev/iReports
            git fetch
            git checkout dev
            git pull origin dev
            docker compose -p ireports-dev down
            # backend и frontend собираются последовательно, не параллельно (COMPOSE_PARALLEL_LIMIT=1) —
            # оба билда (nest build/tsc + vite build) вместе упирались в OOM на сервере с ограниченной
            # памятью, особенно пока рядом уже работает прод-стек.
            COMPOSE_PARALLEL_LIMIT=1 docker compose -p ireports-dev build
            docker compose -p ireports-dev up -d
            # Синхронизирует каталог permission-кодов и системную роль Administrator
            # (backend/src/modules/roles/infrastructure/{permissions-catalog,administrator-role}.seeder.ts)
            # — идемпотентно, безопасно на каждом деплое. Без этого шага bootstrap первого
            # администратора (design.md, Decision 9) никогда не находит роль Administrator и
            # молча пропускает назначение (обнаружено как реальный баг на dev-стенде — сотрудник
            # логинился, но permissions оставались пустыми). Ретраится, пока backend поднимается
            # после миграций в docker-entrypoint.sh.
            for i in $(seq 1 30); do
              docker compose -p ireports-dev exec -T backend node dist/src/scripts/seedPermissions.js && break
              sleep 2
            done

      - name: Notify Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TEXT="✅ *iReports (dev)* задеплоен успешно%0A🌿 Branch: \`${{ github.ref_name }}\`%0A📝 Commit: \`${{ github.sha }}\`%0A👤 Author: ${{ github.actor }}"
          else
            TEXT="❌ *iReports (dev)* деплой упал%0A🌿 Branch: \`${{ github.ref_name }}\`%0A📝 Commit: \`${{ github.sha }}\`%0A👤 Author: ${{ github.actor }}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$TEXT" \
            -d parse_mode="Markdown"
