auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # Хранение логов 30 дней; удаление выполняет compactor (retention_enabled ниже)
  retention_period: 720h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  # Задержка перед физическим удалением чанков — окно, в которое ещё можно отменить удаление
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  # Loki 3 не стартует с retention_enabled: true без delete_request_store:
  # compactor должен где-то хранить запросы на удаление (здесь — рядом с чанками, на filesystem)
  delete_request_store: filesystem
